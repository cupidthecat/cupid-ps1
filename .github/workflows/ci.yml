name: Linux validation

on:
  push:
    branches: [main, 'fix/native-*', 'feat/native-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            id: gcc
            cc: gcc
            sanitizers: ''
            opt: -O2 -g -Werror
          - name: Clang
            id: clang
            cc: clang
            sanitizers: ''
            opt: -O2 -g -Werror
          - name: Clang ASan UBSan
            id: sanitize
            cc: clang
            sanitizers: address,undefined
            opt: -O1 -g -Werror
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config libsdl2-dev \
            libzstd-dev liblzma-dev zlib1g-dev libgl-dev libegl-dev libx11-dev libudev-dev
      - name: Check private input exclusions
        run: |
          if test -n "$(git ls-files -- bios games)"; then
            echo 'BIOS and game inputs must stay outside the tracked tree.' >&2
            exit 1
          fi
      - name: Build emulator, headers, graphics checks and run tests
        run: |
          make -j2 CC=${{ matrix.cc }} BUILD=build/ci \
            OPT="${{ matrix.opt }}" SANITIZERS="${{ matrix.sanitizers }}" TEST_JOBS=4 all hcheck gl-smoke gpu-gl-tests test
      - name: Reject an empty test selection
        run: |
          if build/ci/cupid-ps1-tests NoSuchTestSelection; then
            echo 'An empty test selection must fail.' >&2
            exit 1
          fi
      - name: Check filtered test script
        run: |
          bash scripts/run_tests.sh YamlParser CC=${{ matrix.cc }} BUILD=build/ci \
            OPT="${{ matrix.opt }}" SANITIZERS="${{ matrix.sanitizers }}"
      - name: Package the checked executable for runtime validation
        run: |
          git rev-parse HEAD > build/ci/runtime-revision.txt
          sha256sum build/ci/cupid-ps1 build/ci/cupid-ps1-gpu-gl-tests build/ci/cupid-ps1-gl-smoke dep/soundtouch/lib/libsoundtouch.so.2.3.3 > build/ci/runtime-sha256.txt
          tar -cf build/runtime.tar build/ci/cupid-ps1 build/ci/cupid-ps1-gpu-gl-tests build/ci/cupid-ps1-gl-smoke build/ci/runtime-revision.txt build/ci/runtime-sha256.txt LICENSE licenses
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-runtime-${{ matrix.id }}
          path: build/runtime.tar
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  runtime-validation:
    name: ${{ matrix.name }} runtime
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            id: gcc
            cc: gcc
          - name: Clang
            id: clang
            cc: clang
          - name: Clang ASan UBSan
            id: sanitize
            cc: clang
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: halt_on_error=1
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install runtime and harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config libsdl2-dev \
            libzstd-dev liblzma-dev zlib1g-dev libgl-dev libegl-dev libx11-dev libudev-dev \
            xvfb xauth libgl1-mesa-dri
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-runtime-${{ matrix.id }}
          path: build
      - name: Restore and verify the exact executable and dependency
        run: |
          tar -xf build/runtime.tar
          test "$(cat build/ci/runtime-revision.txt)" = "$(git rev-parse HEAD)"
          sha256sum -c build/ci/runtime-sha256.txt
          mkdir -p build/ci/lib
          cp dep/soundtouch/lib/libsoundtouch.so.2.3.3 build/ci/lib/libsoundtouch.so.2
      - name: Check the OpenGL renderer with software Mesa
        run: |
          xvfb-run -a build/ci/cupid-ps1-gl-smoke
          xvfb-run -a build/ci/cupid-ps1-gpu-gl-tests
          MESA_GL_VERSION_OVERRIDE=3.3CORE MESA_GLSL_VERSION_OVERRIDE=330 xvfb-run -a build/ci/cupid-ps1-gpu-gl-tests
        env:
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Check runtime validation runners
        run: python3 -m unittest discover -s tests -p 'test_*.py'
        env:
          CUPID_TEST_BINARY: build/ci/cupid-ps1
